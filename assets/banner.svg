<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Shimmer Animation -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0">
        <animate attributeName="offset" values="-1; 2" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3">
        <animate attributeName="offset" values="-0.5; 2.5" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0">
        <animate attributeName="offset" values="0; 3" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Floating Orbs in Background -->
  <g opacity="0.35">
    <circle cx="150" cy="100" r="140" fill="#ec4899" filter="url(#glow)">
      <animate attributeName="cy" values="90;120;90" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="140;170;140" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="300" r="160" fill="#3b82f6" filter="url(#glow)">
      <animate attributeName="cy" values="310;270;310" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cx" values="1040;1070;1040" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="90" r="100" fill="#8b5cf6" filter="url(#glow)">
      <animate attributeName="cy" values="80;110;80" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Futuristic Subtle Tech Grid Background -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Left Accent Animated Cocktail Neon Glass Artwork -->
  <g transform="translate(60, 110)">
    <!-- Base Pulse Glow -->
    <path d="M 30,190 L 110,190 M 70,190 L 70,105 M 70,105 L 125,25 L 15,25 Z" 
          stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
    
    <!-- Cocktail Liquid Fill -->
    <polygon points="32,45 108,45 70,95" fill="url(#accentGrad)" opacity="0.85">
      <animate attributeName="opacity" values="0.75;0.95;0.75" dur="3s" repeatCount="indefinite" />
    </polygon>

    <!-- Olive / Garnish Pick -->
    <line x1="45" y1="20" x2="85" y2="70" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <circle cx="65" cy="45" r="7" fill="#ef4444" />
    <circle cx="65" cy="45" r="3" fill="#fbbf24" />

    <!-- Animated Bubbles Floating Out of Glass -->
    <circle cx="62" cy="75" r="3.5" fill="#ffffff" opacity="0.8">
      <animate attributeName="cy" values="75;20;-5" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.5;0" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="78" cy="65" r="2.5" fill="#ffffff" opacity="0.8">
      <animate attributeName="cy" values="65;15;-10" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.4;0" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="55" r="2" fill="#ffffff" opacity="0.8">
      <animate attributeName="cy" values="55;10;-15" dur="3.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.3;0" dur="3.1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center-Left Dynamic Category Badges / Floating Tech Pills -->
  <g transform="translate(230, 290)">
    <!-- Pill 1: Mixology & Inventory -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" />
      <text x="90" y="24" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🍸 Smart Bar Inventory</text>
    </g>

    <!-- Pill 2: Self-Hosted Platforms -->
    <g transform="translate(195, 0)" filter="url(#shadow)">
      <rect width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="90" y="24" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📦 Self-Hosted Stacks</text>
    </g>

    <!-- Pill 3: Recipe Automation -->
    <g transform="translate(390, 0)" filter="url(#shadow)">
      <rect width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" />
      <text x="90" y="24" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Recipe Automation</text>
    </g>

    <!-- Pill 4: Open Cocktail APIs -->
    <g transform="translate(585, 0)" filter="url(#shadow)">
      <rect width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <text x="85" y="24" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Open Datasets &amp; APIs</text>
    </g>
  </g>

  <!-- FOREGROUND: Clean, Unobstructed Main Typography -->
  <g transform="translate(230, 80)">
    <!-- Category Super-Title -->
    <text x="0" y="32" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3">
      CURATED ECOSYSTEM DIRECTORY
    </text>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="90" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      Awesome Cocktail &amp; Recipe Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="132" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.3">
      Lifestyle Apps, Home Bar Inventory Trackers &amp; Open Mixology Stacks
    </text>

    <!-- Detailed Tagline -->
    <text x="0" y="168" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Production SaaS Platforms • Self-Hosted Bar Servers • Raspberry Pi Dispensers • IBA Databases
    </text>
  </g>

  <!-- Outer Modern Ambient Glowing Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6" />
</svg>
